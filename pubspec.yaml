name: rumour
description: "Rumour — anonymous, room-based chat powered by Firebase Cloud Firestore."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^3.0.0
  get_it: ^9.3.0
  dio: ^5.11.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.6
  google_fonts: ^6.3.2
  flutter_svg: ^2.2.1
  flutter_local_notifications: ^19.5.0
  intl: ^0.20.2
  uuid: ^4.5.1
  flutter_native_splash: ^2.4.7

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.10.4
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true # gen-l10n (see l10n.yaml)

  assets:
    - assets/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 23

flutter_native_splash:
  color: "#27272A"
  image: assets/splash/splash_logo.png
  android: true
  ios: true
  web: false
  fullscreen: false
  android_12:
    color: "#27272A"
    image: assets/splash/splash_android12.png
    icon_background_color: "#27272A"
